<meta name="description" content="A wellness retreat gone offline. Trade contraband at a Big Sur digital detox, pay off Dale, and keep your zen around Guide Saffron.">
<meta name="theme-color" content="#22382B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="unplugged">

<meta property="og:description" content="A wellness retreat gone offline. Be the plug. Keep your zen.">
<meta property="og:url" content="https://trihards.github.io/unplugged/">
<meta property="og:image" content="https://trihards.github.io/unplugged/og-image.jpg">

<style>
/* Palette taken from the retreat art: forest green, linen cream, sash sage, poppy, rust */
:root {
  --fog: #F4ECDD;
  --mist: #FFF9EF;
  --ink: #22382B;
  --ink2: #56695B;
  --line: rgba(34, 56, 43, .14);
  --poppy: #EE8A2E;
  --poppy-soft: #FBE0C2;
  --poppy-ink: #6B3300;
  --sea: #4F7A4B;
  --sea-soft: #DCE7D3;
  --urchin: #A3472A;
  --urchin-soft: #F5DCCF;
  --cta: #22382B;
  --cta-ink: #FBEBD3;
  --lift: 0 1px 0 rgba(34, 56, 43, .05), 0 10px 28px rgba(34, 56, 43, .14);
  --serif: "Playpen Sans", "Chalkboard SE", "Comic Sans MS", system-ui, sans-serif;
  --sans: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --sky-top: var(--fog);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fog: #141F19; --mist: #1C2A22; --ink: #F3E7D3; --ink2: #B6C0B2; --line: rgba(243, 231, 211, .14);
    --poppy: #F2A055; --poppy-soft: #3D2A16; --poppy-ink: #FBD3A4;
    --sea: #A3C49A; --sea-soft: #26382C; --urchin: #E79B7E; --urchin-soft: #3B241B;
    --cta: #F3E7D3; --cta-ink: #14201A;
    --lift: 0 1px 0 rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .35);
  }
}
:root[data-theme="dark"] {
  --fog: #141F19; --mist: #1C2A22; --ink: #F3E7D3; --ink2: #B6C0B2; --line: rgba(243, 231, 211, .14);
  --poppy: #F2A055; --poppy-soft: #3D2A16; --poppy-ink: #FBD3A4;
  --sea: #A3C49A; --sea-soft: #26382C; --urchin: #E79B7E; --urchin-soft: #3B241B;
  --cta: #F3E7D3; --cta-ink: #14201A;
  --lift: 0 1px 0 rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .35);
}

*, *::before, *::after { box-sizing: inherit; }
html {
  height: 100%;
  scroll-padding-top: env(safe-area-inset-top, 0px);
  background: linear-gradient(var(--sky-top) 50%, var(--sky-bottom, var(--mist)) 50%);
}
body {
  height: 100%; margin: 0;
  background: var(--fog); color: var(--ink);
  font-family: var(--sans); font-size: 16px; line-height: 1.4;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--poppy); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

#app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; position: relative; }
/* Wide screens: the game sits in a column over a soft-focus copy of the scene, tinted to the time of day. */
#backdrop { display: none; position: fixed; inset: 0; z-index: -1; overflow: hidden; background: #22382B; pointer-events: none; }
#backdrop::before { content: ""; position: absolute; inset: -60px; background: var(--img-backdrop, var(--img-header)) center 55% / cover no-repeat; filter: blur(16px) saturate(1.08); }
#backdrop::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(18, 28, 22, .35), rgba(18, 28, 22, .05) 30%, rgba(18, 28, 22, .05) 70%, rgba(18, 28, 22, .35)), var(--bd-tint, transparent); transition: background .6s ease; }
@media (min-width: 600px) {
  #backdrop { display: block; }
  body { background: transparent; }
  #app { background: var(--fog); box-shadow: 0 0 0 1px rgba(0, 0, 0, .12), 0 24px 70px rgba(0, 0, 0, .45); }
}

/* ---------- welcome ---------- */
.welcome {
  flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center;
  padding: 26px 20px 0; overflow-x: hidden; overflow-y: auto; position: relative;
  background: #E9B877 var(--img-welcome) center 32% / cover no-repeat;
  color: #22382B;
}
.welcome > * { position: relative; }
.logo-big { width: min(82%, 340px); aspect-ratio: 640 / 217; border: 0; padding: 0; margin-top: 10px; background-color: #22382B; -webkit-mask: var(--img-logo) center / contain no-repeat; mask: var(--img-logo) center / contain no-repeat; }
.tagline { display: block; width: min(76%, 300px); aspect-ratio: 620 / 59; margin: 12px 0 0; background-color: #22382B; -webkit-mask: var(--img-tagline) center / contain no-repeat; mask: var(--img-tagline) center / contain no-repeat; }
.wbtns { display: flex; flex-direction: column; gap: 12px; width: min(100%, 320px); margin-top: 22px; }
.wbtns .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.lineup { margin: auto -20px 0; width: calc(100% + 40px); max-width: none; height: auto; flex: 0 0 auto; display: block; pointer-events: none; }
.breath { position: relative; width: 180px; height: 180px; margin: 22px 0 18px; display: grid; place-items: center; }
.breath .orb {
  position: absolute; inset: 0; border-radius: 50%;
  background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.85), rgba(255,255,255,.25) 60%, rgba(255,255,255,0) 72%);
  box-shadow: 0 0 0 1px rgba(30,58,47,.08) inset;
  animation: breathe 8s ease-in-out infinite;
}
.breath .cue { position: relative; font-family: var(--serif); font-size: 20px; color: #4F665B; }
.breath .cue span { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); white-space: nowrap; animation: cueA 8s ease-in-out infinite; }
.breath .cue span + span { animation-name: cueB; }
@keyframes breathe { 0%, 100% { transform: scale(.78); } 50% { transform: scale(1); } }
@keyframes cueA { 0%, 45% { opacity: 1; } 50%, 95% { opacity: 0; } 100% { opacity: 1; } }
@keyframes cueB { 0%, 45% { opacity: 0; } 50%, 95% { opacity: 1; } 100% { opacity: 0; } }

.stack { display: flex; flex-direction: column; gap: 10px; width: min(100%, 340px); }


/* ---------- buttons ---------- */
.btn {
  min-height: 52px; border-radius: 18px; border: 2.5px solid var(--ink); padding: 0 16px;
  font-family: var(--serif); font-weight: 600; font-size: 17px; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  background: var(--mist); color: var(--ink); box-shadow: 0 3px 0 var(--ink);
  transition: transform .06s ease, box-shadow .06s ease;
}
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn svg { width: 22px; height: 22px; flex: 0 0 auto; }
.btn.primary { background: var(--cta); color: var(--cta-ink); }
.btn.quiet { background: var(--mist); color: var(--ink); }
.btn.soft { background: var(--sea-soft); color: var(--ink); }
.btn .ver { position: absolute; right: 18px; font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--ink2); }
.btn.news { position: relative; }
.btn.warn { background: var(--urchin); color: var(--mist); }
.btn:disabled { opacity: .4; box-shadow: none; }
.welcome .btn { border-color: #22382B; box-shadow: 0 3px 0 #22382B; background: #FBEBD3; color: #22382B; }
.welcome .btn.primary { background: #22382B; color: #FBEBD3; }
.welcome .btn:active { box-shadow: 0 1px 0 #22382B; }
.link { background: none; border: 0; padding: 6px 2px; font-weight: 600; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 4px; color: inherit; }

/* ---------- game: sky hero ---------- */
.hero {
  position: relative; overflow: hidden;
  padding: 2px 16px 10px; min-height: 148px;
  display: flex; flex-direction: column;
  background: #C9C3CF var(--img-header) center 64% / cover no-repeat;
  color: var(--h-ink);
  flex: 0 0 auto;
}
.hero::before { content: ""; position: absolute; inset: 0; background: var(--tint); transition: background .6s ease; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(18, 28, 22, .8) 0%, rgba(18, 28, 22, .35) 42%, rgba(18, 28, 22, 0) 70%); }
.hero > * { position: relative; z-index: 1; }
.logo-mark { display: block; width: 96px; aspect-ratio: 640 / 217; background-color: currentColor; -webkit-mask: var(--img-logo) left center / contain no-repeat; mask: var(--img-logo) left center / contain no-repeat; }
.topbar { position: relative; display: flex; align-items: center; gap: 8px; min-height: 44px; }
.topbar .mark { background: none; border: 0; padding: 6px 4px 6px 0; color: inherit; }
.topbar .spacer { flex: 1; }
.placeline { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; color: #FBEBD3; }
.placeline .clock { flex: 0 0 auto; font-weight: 600; font-size: 13.5px; padding: 4px 10px; border-radius: 999px; background: rgba(251, 235, 211, .92); color: #22382B; }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; border: 0; background: none; display: grid; place-items: center; color: inherit; }
.iconbtn svg { width: 22px; height: 22px; }
.hero h1 { position: relative; font-family: var(--serif); font-weight: 600; font-size: 26px; line-height: 1.15; margin: 0; min-width: 0; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
.hero .flavor { position: relative; margin: 3px 0 0; font-size: 14px; line-height: 1.35; color: #FBEBD3; opacity: .92; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-shadow: 0 1px 2px rgba(0,0,0,.4); }

/* ---------- stats ---------- */
.stats {
  display: grid; grid-template-columns: 44px 1fr 1fr 1.15fr; gap: 0 12px; align-items: center;
  padding: 8px 18px; background: var(--mist); border-bottom: 1px solid var(--line);
  flex: 0 0 auto;
}
.zen { position: relative; width: 44px; height: 44px; }
.zen svg { width: 44px; height: 44px; display: block; }
.zen .trk { fill: none; stroke: var(--line); stroke-width: 5; }
.zen .val { fill: none; stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset .5s ease; }
.zen b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 14px; font-weight: 700; }
.stat { min-width: 0; }
.stat .k { font-size: 12.5px; color: var(--ink2); white-space: nowrap; }
.stat .v { font-size: clamp(15px, 4.4vw, 17px); font-weight: 600; white-space: nowrap; }
.stat .x { font-size: 12.5px; color: var(--ink2); white-space: nowrap; }
.stat .v.dale { color: var(--urchin); }
.stat .x.dale { color: var(--urchin); }

/* ---------- list ---------- */
.list { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 2px 0 6px; }
.row {
  width: 100%; display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center;
  background: none; border: 0; padding: 6px 18px; text-align: left; min-height: 46px;
  border-bottom: 1px solid var(--line);
}
.row:last-child { border-bottom: 0; }
.row:active { background: var(--mist); }
.row .nm { font-size: 16.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.row .hv { font-size: 13.5px; font-weight: 600; color: var(--ink2); white-space: nowrap; }
.row .pr { font-size: 17px; font-weight: 600; padding: 3px 0; border-radius: 999px; white-space: nowrap; }
.row .pr.hot { background: var(--poppy-soft); color: var(--poppy-ink); padding: 3px 10px; }
.row .pr.calm { background: var(--sea-soft); color: var(--sea); padding: 3px 10px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.legend { display: flex; gap: 14px; padding: 8px 18px 2px; font-size: 13px; color: var(--ink2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.row.na .pr, .row.na .nm { color: var(--ink2); }
.pill { font-size: 12.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; }
.pill.hot { background: var(--poppy-soft); color: var(--poppy-ink); }
.pill.calm { background: var(--sea-soft); color: var(--sea); }
.empty { padding: 18px; color: var(--ink2); }

/* ---------- bottom bar ---------- */
.bar {
  flex: 0 0 auto; display: flex; gap: 10px; padding: 8px 14px 10px;
  background: var(--mist); border-top: 1px solid var(--line);
}
.bar .btn { flex: 1; }
.bar .btn.primary { flex: 1.4; }
.bar .btn { padding: 0 10px; white-space: nowrap; }

/* ---------- sheets ---------- */
#scrim { position: fixed; inset: 0; z-index: 20; background: rgba(15, 26, 22, .38); display: flex; align-items: flex-end; justify-content: center; }
#scrim[hidden] { display: none; }
#sheet {
  position: relative;
  width: min(100%, 560px); max-height: 90%; overflow-y: auto;
  background: var(--mist); color: var(--ink);
  border-radius: 26px 26px 0 0; box-shadow: var(--lift);
  padding: 8px 20px calc(18px + env(safe-area-inset-bottom, 0px));
  animation: rise .26s cubic-bezier(.2, .8, .2, 1);
}
#sheet.alert { box-shadow: 0 -4px 0 var(--urchin), var(--lift); }
@keyframes rise { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
.xbtn { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--fog); color: var(--ink2); display: grid; place-items: center; }
.xbtn svg { width: 18px; height: 18px; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 2px auto 12px; }
#sheet h3 { font-family: var(--serif); font-weight: 600; font-size: 26px; line-height: 1.15; margin: 0 0 4px; }
#sheet p { margin: 6px 0; }
#sheet .muted { color: var(--ink2); font-size: 15px; }
.sheet-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.sheet-actions.two { flex-direction: row; }
.sheet-actions.two .btn { flex: 1; }

.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--fog); border-radius: 14px; padding: 4px; margin: 14px 0 6px; }
.seg.four { grid-template-columns: repeat(4, 1fr); }
.seg button { border: 0; background: none; min-height: 40px; border-radius: 11px; font-weight: 600; font-size: 15px; color: var(--ink2); padding: 0 4px; }
.seg button[aria-pressed="true"] { background: var(--mist); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.seg button:disabled { opacity: .35; }
.qtybig { display: flex; align-items: baseline; justify-content: space-between; margin: 12px 0 2px; }
.qtybig .n { font-family: var(--serif); font-size: 44px; line-height: 1; }
.qtybig .t { font-size: 15px; color: var(--ink2); }
input[type=range] { width: 100%; height: 44px; margin: 0; background: none; -webkit-appearance: none; appearance: none; }
input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--ink) var(--fill, 0%), var(--line) var(--fill, 0%)); }
input[type=range]::-moz-range-track { height: 8px; border-radius: 4px; background: var(--line); }
input[type=range]::-moz-range-progress { height: 8px; border-radius: 4px; background: var(--ink); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; border-radius: 50%; background: var(--mist); box-shadow: 0 0 0 2px var(--ink), 0 2px 6px rgba(0,0,0,.2); margin-top: -11px; }
input[type=range]::-moz-range-thumb { width: 28px; height: 28px; border-radius: 50%; background: var(--mist); border: 2px solid var(--ink); }
input[type=range]:disabled { opacity: .35; }
.chips { display: flex; gap: 8px; margin: 4px 0 2px; }
.chip { border: 0; background: var(--fog); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 14px; min-height: 36px; }
.ledger { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; margin: 8px 0; font-size: 15px; }
.ledger .v { font-weight: 600; text-align: right; }
.ledger .dale { color: var(--urchin); }
.note-err { color: var(--urchin); font-weight: 600; min-height: 1.4em; font-size: 14.5px; }
.note-err.ok { color: var(--sea); }

/* journey map */
.map {
  /* the art is light in both themes, so the map keeps the light-theme tokens */
  --ink: #22382B; --ink2: #56695B; --mist: #FFF9EF; --poppy: #EE8A2E; --sea: #4F7A4B; --sea-soft: #DCE7D3; --cta: #22382B;
  position: relative; width: 100%; aspect-ratio: 1 / 1; margin: 10px 0 2px; border-radius: 20px; overflow: hidden;
  background: #8FB35A url(assets/img/map-bg.webp) center / 100% 100% no-repeat;
}
/* Each spot is a 44px tap target centered on a small dot, with a one-line label beside it (b/t/l/r of the dot). */
.node {
  position: absolute; transform: translate(-50%, -50%); width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
  background: none; border: 0; padding: 0; color: var(--ink);
}
.node .dot { width: 13px; height: 13px; border-radius: 50%; display: block; background: var(--mist); box-shadow: 0 0 0 2px var(--mist), 0 0 0 3px rgba(34, 56, 43, .35); }
.node .lbl {
  position: absolute; padding: 1px 7px; font-size: 12px; font-weight: 700; line-height: 1.3; white-space: nowrap; border-radius: 999px;
  background: rgba(255, 249, 239, .88); box-shadow: 0 1px 2px rgba(34, 56, 43, .28);
}
.node .lbl i { font-style: normal; color: var(--ink2); }
.node.pb .lbl { top: calc(50% + 10px); left: 50%; transform: translateX(-50%); }
.node.pt .lbl { bottom: calc(50% + 10px); left: 50%; transform: translateX(-50%); }
.node.pr .lbl { left: calc(50% + 11px); top: 50%; transform: translateY(-50%); }
.node.pl .lbl { right: calc(50% + 11px); top: 50%; transform: translateY(-50%); }
.node.here .dot { width: 14px; height: 14px; background: var(--poppy); box-shadow: 0 0 0 2px var(--mist), 0 0 0 8px rgba(238, 138, 46, .35); }
.node:not(:disabled) .dot { background: var(--cta); }
.node:not(:disabled).van .dot { background: var(--sea); }
.node:disabled:not(.here) .dot { opacity: .5; }
.node:disabled:not(.here) .lbl { color: var(--ink2); }
.node:focus-visible { outline: none; }
.node:focus-visible .dot, .node:focus-visible .lbl { outline: 2px solid var(--ink); outline-offset: 2px; }

/* encounter */
.enc-log p { margin: 4px 0; font-size: 15.5px; }
.enc-log .bad { color: var(--urchin); font-weight: 600; }
.enc-log .good { color: var(--sea); font-weight: 600; }

/* lists inside sheets */
.picklist { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.pick {
  text-align: left; border: 0; border-radius: 18px; padding: 14px 16px; background: var(--fog);
  display: grid; gap: 2px;
}
.pick .t { font-family: var(--serif); font-size: 20px; }
.pick .d { color: var(--ink2); font-size: 14.5px; }
.pick.last { box-shadow: 0 0 0 2px var(--ink) inset; }
.board { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 12px; margin: 8px 0 14px; font-size: 15px; }
.board .s { font-weight: 600; text-align: right; }
.board .t { grid-column: 2 / 4; color: var(--ink2); font-size: 13.5px; margin-top: -4px; }
.board .me { color: var(--sea); }
.journal p { margin: 0 0 8px; font-size: 15px; }

/* ---------- toasts ---------- */
#toasts { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 8px); width: min(94%, 520px); display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
#toasts.top { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 10px); flex-direction: column; }
.toast {
  pointer-events: auto; background: var(--mist); color: var(--ink); border-radius: 16px; box-shadow: var(--lift);
  padding: 11px 14px 11px 14px; display: grid; grid-template-columns: 10px 1fr; gap: 10px; align-items: start;
  font-size: 15px; line-height: 1.35; border: 0; text-align: left; width: 100%;
  animation: drop .22s ease-out;
}
.toast i { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; background: var(--ink2); }
.toast.hot i { background: var(--poppy); }
.toast.good i { background: var(--sea); }
.toast.bad i { background: var(--urchin); }
@keyframes drop { from { transform: translateY(-10px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- night veil (rest) ---------- */
#veil { position: fixed; inset: 0; z-index: 25; pointer-events: none; opacity: 0; transition: opacity .55s ease;

let ac = null;
let soundOn = store.get('unpw.sound', true);
function chime(notes, decay = 0.7, gain = 0.05) {
  if (!soundOn) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const t0 = ac.currentTime + 0.01;
    for (const [f, at] of notes) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + at);
      g.gain.exponentialRampToValueAtTime(gain, t0 + at + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + decay);
      o.connect(g); g.connect(ac.destination);
      o.start(t0 + at); o.stop(t0 + at + decay + 0.05);
    }
  } catch (e) { /* no audio */ }
}

const used = () => ITEMS.reduce((a, i) => a + S.inv[i.id], 0);
const free = () => S.cap - used();

function genPrices() {
  const P = PLACES[S.loc];
  const avail = ITEMS.filter(() => Math.random() < 0.7);
  while (avail.length < 4) { const c = pick(ITEMS); if (!avail.includes(c)) avail.push(c); }
  const prices = {};
  avail.forEach(it => { prices[it.id] = Math.max(1, Math.round(rf(it.min, it.max) * (P.bias[it.id] || 1))); });
  const news = [];
  if (Math.random() < 0.35) {
    const it = pick(avail);
    if (Math.random() < 0.5) { prices[it.id] = Math.round(prices[it.id] * rf(2, 3.5)); news.push({ text: it.up, kind: 'up', id: it.id }); }
    else { prices[it.id] = Math.max(1, Math.round(prices[it.id] / rf(2, 4))); news.push({ text: it.down, kind: 'down', id: it.id }); }
  }
  S.prices = prices;
  return news;
}

function accrue(h) { if (S.debt > 0) S.debt = Math.ceil(S.debt * Math.pow(1 + S.rate, h)); ST().peakDebt = Math.max(ST().peakDebt, S.debt); }
const canReach = ix => ix !== S.loc && S.hour + HOURS[S.loc][ix] <= LIGHTS;
function walk(ix) {
  if (!S || S.over || !canReach(ix)) return;
  const h = HOURS[S.loc][ix];
  accrue(h); S.hour += h; S.loc = ix;
  { const st = ST(); st.walks++; st.hours += h; st.visits[ix] = (st.visits[ix] || 0) + 1; if (S.hour >= 20) st.lateNights++; }
  S.flavor = PLACES[ix].via;

function rest() {
  if (!S || S.over) return;

    news.forEach(n => whisper(n));

function rollEvents() {
  const load = used() / S.cap, k = S.k, prog = S.day / S.days, vf = valueFactor();
  const chase = (0.03 + 0.06 * load + 0.16 * vf * vf + 0.04 * prog) * k;
  if (used() > 0 && Math.random() < chase) {
    queue.push(startEncounter);
  } else {
    const r = Math.random();
    if (r < 0.06 * k && S.cash > 50) {
      const amt = Math.round(S.cash * rf(0.1, 0.25));
      S.cash -= amt; ST().raided += amt; SND.bad();
      const t = pick(RAIDS).replace('$X', fmt(amt));
      log(t); setTimeout(() => toast(t, 'bad', 5500), 300);
    } else if (r < 0.12 * k) {
      const it = BYID[pick(['espresso', 'choc', 'coke', 'doritos'])];
      const q = Math.min(ri(3, 10), free());
      if (q > 0) {
        S.inv[it.id] += q; ST().found += q;
        const t = `You find ${q} ${it.plural} in ${pick(FINDS)}.`;
        log(t); setTimeout(() => { SND.good(); toast(t, 'good', 4500, null, itemIcon(it.id)); }, 300);
      }
    } else if (r < 0.17 * k && S.cap < MAXCAP) {
      const price = Math.round(120 * Math.pow(2, Math.round((S.cap - START_CAP) / 40)) * rf(0.85, 1.15));
      queue.push(() => {
        if (S.cash < price) return runQueue();
        offerSheet('A bigger cushion', `A guest is selling a bigger meditation cushion with a hidden zipper. It holds 40 more.`, `Buy it for ${fmt(price)}`, () => {
          S.cash -= price; S.cap += 40; SND.receive();
          log(`Bought a bigger cushion for ${fmt(price)}. Room for ${S.cap}.`); toast(`New cushion. Room for ${S.cap}.`, 'good');
        });
      });
    } else if (r < 0.22 * k && S.decoys < MAXDECOY) {
      const price = Math.round(150 * Math.pow(1.8, S.decoys) * rf(0.85, 1.15));
      queue.push(() => {
        if (S.cash < price) return runQueue();
        offerSheet('A decoy for hire', `A guest from Marin offers to be your decoy if Guide Saffron comes around. She cries on cue, about ${DECOY_SHARES} times before she's all cried out.`, `Hire her for ${fmt(price)}`, () => {
          S.cash -= price; S.decoyShares += DECOY_SHARES; syncDecoys(); SND.receive();
          log(`Hired a decoy for ${fmt(price)}. You have ${S.decoys}, with ${plural(S.decoyShares, 'breakthrough', 'breakthroughs')} left in them.`);
          toast(`Decoy hired. You have ${plural(S.decoys, 'decoy', 'decoys')}.`, 'good');
        });
      });
    } else if (r < 0.26 * k && S.zen < 100) {
      const g = Math.min(ri(10, 25), 100 - S.zen);
      S.zen += g;
      const t = `${pick(CALM)} Zen +${g}.`;
      log(t); setTimeout(() => { SND.bowl(); toast(t, 'good', 4500); }, 300);
    }
  }
  if (S.debt > 2 * START_DEBT && prog > 0.2 && Math.random() < 0.08 * k) {
    const d = ri(5, 12);
    S.zen -= d;
    const t = `Dale left a note on your yurt. It's just a number: ${fmt(S.debt)}. Zen -${d}.`;
    log(t); setTimeout(() => { SND.bad(); toast(t, 'bad', 5500, IMG.daleMad); }, 400);
    if (S.zen <= 0) { S.zen = 0; queue.unshift(() => snap()); }
  }
}

/* ================= trading ================= */
const canBuy = id => { const p = S.prices[id]; return p ? Math.max(0, Math.min(Math.floor(S.cash / p), free())) : 0; };
function openTrade(id) {
  if (!S || S.over) return;
  const p = S.prices[id], have = S.inv[id];
  const avg = have ? S.paid[id] / have : 0;
  let mode = 'buy';
  if (have && (!canBuy(id) || (p && p > avg))) mode = 'sell';
  trade = { id, mode, q: 0 };
  trade.q = tradeMax();
  SND.tap();
  tradeSheet();
}
function tradeMax() { return trade.mode === 'buy' ? canBuy(trade.id) : S.inv[trade.id]; }
function tradeSheet() {
  const it = BYID[trade.id], p = S.prices[trade.id], have = S.inv[trade.id];
  const avg = have ? Math.round(S.paid[trade.id] / have) : 0;

  if (!p) {
    openSheet(`<div class="grab"></div><div class="item-head">${iconHTML(it.id)}<h3 id="sheetTitle">${it.name}</h3></div>

  }

    <div class="item-head">${iconHTML(it.id)}<h3 id="sheetTitle">${it.name}</h3></div>
    <p class="muted"><span class="num">${fmt(p)}</span> each here. ${held} Room for ${free()} more in your cushion.</p>
    <div class="seg" role="group" aria-label="Trade">
      <button type="button" data-tmode="buy" aria-pressed="${trade.mode === 'buy'}" ${canBuy(trade.id) ? '' : 'disabled'}>Receive</button>
      <button type="button" data-tmode="sell" aria-pressed="${trade.mode === 'sell'}" ${have ? '' : 'disabled'}>Let go</button>
    </div>
    <div class="qtybig"><span class="n num" id="tq">${trade.q}</span><span class="t num" id="tt"></span></div>
    <input type="range" id="tslider" min="${max ? 1 : 0}" max="${max}" step="1" value="${trade.q}" aria-label="How many" ${max ? '' : 'disabled'}>
    <div class="chips">
      <button type="button" class="chip" data-tset="1" ${max ? '' : 'disabled'}>One</button>
      <button type="button" class="chip" data-tset="half" ${max > 1 ? '' : 'disabled'}>Half</button>
      <button type="button" class="chip" data-tset="max" ${max ? '' : 'disabled'}>All ${max}</button>
    </div>
    <div class="sheet-actions"><button type="button" class="btn primary" id="tgo" data-act="trade" ${max ? '' : 'disabled'}></button></div>`, 'trade');
  updateTrade();
}
function updateTrade() {
  const p = S.prices[trade.id], q = trade.q, it = BYID[trade.id];
  const sl = $('#tslider'); if (!sl) return;
  const max = +sl.max, min = +sl.min;
  sl.value = q;
  sl.style.setProperty('--fill', `${max > min ? ((q - min) / (max - min)) * 100 : 100}%`);
  $('#tq').textContent = q;
  const go = $('#tgo');
  if (trade.mode === 'buy') {
    $('#tt').textContent = `${fmt(p * q)} of your ${fmt(S.cash)}`;
    go.textContent = q ? `Receive ${q} for ${fmt(p * q)}` : (S.cash < p ? `Not enough cash for one` : `Your cushion is full`);
  } else {
    const have = S.inv[trade.id];
    const gain = have ? p * q - S.paid[trade.id] * (q / have) : 0;
    $('#tt').textContent = q ? `${gain >= 0 ? '+' : ''}${fmt(gain)} on what you paid` : '';
    go.textContent = q ? `Let go of ${q} for ${fmt(p * q)}` : `You have none to let go of`;
  }
  go.disabled = !q;
  if (!q) go.setAttribute('aria-label', go.textContent); else go.removeAttribute('aria-label');
}
function doTrade() {
  const it = BYID[trade.id], p = S.prices[trade.id], q = trade.q;
  if (!p || !q) return;
  if (trade.mode === 'buy') {
    if (q > canBuy(it.id)) return;
    S.cash -= p * q; S.inv[it.id] += q; S.paid[it.id] += p * q; ST().bought += q;
    SND.receive(); buzz(12);
    log(`Received ${q} ${it.plural} for ${fmt(p * q)}.`);
    toast(`Received ${q} ${it.plural} for ${fmt(p * q)}.`, '', 2600);
  } else {
    const have = S.inv[it.id]; if (q > have) return;
    const basis = S.paid[it.id] * (q / have), gain = p * q - basis;
    S.cash += p * q; S.inv[it.id] -= q; S.paid[it.id] -= basis;
    { const st = ST(); st.sold += q; st.profit += gain; if (!st.best || gain > st.best.gain) st.best = { id: it.id, q, gain }; if (TECH.includes(it.id)) st.tech += q; if (it.id === 'coke') st.coke += q; }
    if (!S.inv[it.id]) S.paid[it.id] = 0;
    SND.letgo(); buzz([10, 40, 10]);
    log(`Let go of ${q} ${it.plural} for ${fmt(p * q)} (${gain >= 0 ? '+' : ''}${fmt(gain)}).`);
    toast(`Let go of ${q} ${it.plural} for ${fmt(p * q)}. ${gain >= 0 ? `${fmt(gain)} gained.` : `${fmt(-gain)} lost.`}`, gain >= 0 ? 'good' : 'bad', 3000);
  }
  trade = null;
  closeSheet();
}

const TAKE_LO = 0.12, TAKE_HI = 0.25, TAKE_PER_VOL = 0.02, HAND_FRAC = 1 / 3, DONATE_FRAC = 0.15;

function cushionValue() { return ITEMS.reduce((a, it) => a + S.inv[it.id] * itemValue(it), 0); }
/* 0 to 1: how tempting your cushion is, on a log scale ($1k is about half, $300k and up is everything) */
function valueFactor() { const v = cushionValue(); return v <= 1 ? 0 : Math.min(1, Math.log10(v) / 5.5); }
function topItem() {
  let best = null, bv = 0;
  for (const it of ITEMS) { const v = S.inv[it.id] * itemValue(it); if (v > bv) { bv = v; best = it; } }
  return best;
}
const shareOf = (have, frac) => Math.min(have, Math.max(1, Math.round(have * frac)));
function confiscate(frac) {
  const it = topItem(); if (!it) return null;
  const have = S.inv[it.id], q = shareOf(have, frac), value = q * itemValue(it);
  S.paid[it.id] -= S.paid[it.id] * (q / have);
  S.inv[it.id] -= q;
  if (!S.inv[it.id]) S.paid[it.id] = 0;
  enc.lostValue += value;
  enc.lostGoods[it.id] = (enc.lostGoods[it.id] || 0) + q;
  { const st = ST(); st.confUnits += q; st.confValue += value; st.conf[it.id] = (st.conf[it.id] || 0) + q; }
  return { it, q, value };
}
const nameOf = (it, q) => (q === 1 ? it.name.toLowerCase().replace(/s$/, '') : it.plural);

function encDecoy() {

}

    : G('B', `Checked in ${st.checkins === 1 ? 'once' : st.checkins === 2 ? 'twice' : `${st.checkins} times`}. Talked it out.`);

function superlative() {
  const st = ST(), ri0 = rankIndex();
  if (S.reason === 'zen') return 'Withdrew early to start a podcast';
  if (ri0 === 5) return 'Should probably be running this place';
  if (st.tech >= 150) return 'Least unplugged guest in retreat history';
  if (st.confUnits >= 40) return "Guide Saffron's favorite donor";
  if (st.escapes >= 3) return 'Fastest walking meditation on record';
  if (netWorth() < 0) return "Dale's favorite liability";
  if (st.lateNights >= 5) return 'Most likely to be in the parking lot at 9pm';

const shuffle = a => a.map(v => [Math.random(), v]).sort((p, q) => p[0] - q[0]).map(p => p[1]);
/* Staff comments: the most specific lines about your run come first; generic ones only fill gaps. */
function chooseLines(specific, generic) {
  const out = specific.length ? [specific[0], ...shuffle(specific.slice(1, 4)).slice(0, 1)] : [];
  const g = shuffle(generic);
  while (out.length < 2 && g.length) out.push(g.shift());

}
function staffComments(who) {

  const keep = arr => arr.filter(Boolean);
  if (who.kind === 'dale') {
    return chooseLines(keep([
      S.debt > 0 ? `Still owes me ${fmt(S.debt)}. I know which yurt.` : null,
      st.borrowed ? `Borrowed another ${fmt(st.borrowed)} off me. Bold. I respect bold.` : null,
      st.paidDay ? `Paid me back on day ${st.paidDay}. Didn't tip.` : null,
      lot >= 5 ? `Came up to the van ${lot} times. I'm not a therapist.` : null,
      st.tech >= 50 ? `Moved ${st.tech} phones and chargers. Didn't learn that from me.` : null,
      hasSong('w2') ? 'Bought my CD. Finally, someone who gets it.' : null,
    ]), ['Asked me for the wifi password. I live in a van.', hasSong('w2') ? 'Good taste in music. Bad taste in everything else.' : 'Never bought my CD. Their loss.'])
      .map(l => `“${l}”`);

  if (who.kind === 'saffron') {
    return chooseLines(keep([
      S.reason === 'zen' ? "Screamed during Noble Silence. I'm choosing to hear it as a breakthrough." : null,
      st.donated ? `Gave ${fmt(st.donated)} to the scholarship fund. There is no scholarship fund.` : null,

      st.escapes ? `They ran from me ${st.escapes === 1 ? 'once' : `${st.escapes} times`}. Running is also a feeling.` : null,
      !st.checkins ? 'I never once caught them. That worries me more.' : null,

      st.zenMin < 40 && S.reason !== 'zen' ? `Their zen bottomed out at ${st.zenMin}. I offered a hug. They declined.` : null,

      .map(l => `“${l}”`);

  return chooseLines(keep([
    st.coke ? `[gestures at ${st.coke} empty Diet Kola cans]` : null,
    st.escapes ? '[mimes running. sighs.]' : null,
    st.decoyWins ? '[still emotionally recovering from your decoy]' : null,
    lot >= 3 ? '[points at the parking lot, then at you, then at the parking lot]' : null,
    st.tech >= 50 ? '[silently confiscates your phone, then remembers it is not yours]' : null,
    S.reason === 'zen' ? '[covers ears, remembering the scream]' : null,

    x.fillStyle = INK2; x.font = `400 25px ${BODY}`; wrap(c, 150, y + 72, W - 150 - 56, 28, 1);
    y += rowH;
  }
  // comments box with the staff member's portrait
  y += 16;
  const bx = 40, bw = W - 80, bh = H - y - 104;
  x.fillStyle = CARD; rr(bx, y, bw, bh, 26); x.fill(); x.strokeStyle = INK; x.lineWidth = 5; x.stroke();
  let fw = 0;
  if (face) {
    const fh = Math.min(bh - 16, 250); fw = face.width * fh / face.height;
    x.save(); rr(bx, y, bw, bh, 26); x.clip(); x.drawImage(face, bx + 18, y + bh - fh - 4, fw, fh); x.restore();
  }
  const tx = bx + 18 + fw + 22, tw = bx + bw - 28 - tx;
  x.fillStyle = INK; x.font = `600 29px ${HAND}`; let ty = y + 50; ty += wrap(`Comments from ${info.label}`, tx, ty, tw, 34, 1) + 8;
  x.fillStyle = INK; x.font = `400 28px ${BODY}`;
  for (const l of who.lines) ty += wrap(l, tx, ty, tw, 34, 3) + 12;
  // footer
  const n = netWorth();
  x.fillStyle = INK; x.font = `700 36px ${HAND}`; x.fillText(`Takeaway: ${rankFor(n, S.reason)}`, 56, H - 46);
  x.textAlign = 'right'; x.fillText(fmt(n), W - 56, H - 46); x.textAlign = 'left';

}

async function shareCard() {
  if (!cardCanvas || !cardWho) return;
  const text = cardSummary(cardWho.lines);
  try {
    const blob = await new Promise(r => cardCanvas.toBlob(r, 'image/png'));
    const file = blob && new File([blob], 'unplugged-report-card.png', { type: 'image/png' });
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text }); return; }
    if (navigator.share) { await navigator.share({ text }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text); toast('Copied a summary. Long-press the card to save the picture.', 'good', 4500); }
  catch (e) { toast('Long-press the card to save it, then share it anywhere.', '', 4500); }
}

function openSheet(html, kind, tone, dismissible = true) {
  const scrim = $('#scrim'), sh = $('#sheet');

  sh.dataset.dismiss = dismissible ? '1' : '';

  sheetKind = kind;
  scrim.hidden = false;
  $('#toasts').classList.add('top');
  if (fresh) { sh.style.animation = 'none'; void sh.offsetHeight; sh.style.animation = ''; }
  const f = sh.querySelector('.btn.primary:not(:disabled)') || sh.querySelector('.btn:not(:disabled), .pick, .node:not(:disabled)') || sh.querySelector('button:not(:disabled)');
  if (f) f.focus({ preventScroll: true });

function closeSheet(silent) {
  const scrim = $('#scrim');

  scrim.hidden = true; scrim.className = ''; $('#sheet').innerHTML = ''; sheetKind = null;

let heldToasts = [];
function toast(text, tone = '', ms = 3500, face, icon) {
  if (enc && sheetKind === 'enc') { heldToasts.push([text, tone, ms, face, icon]); return; }
  const box = $('#toasts');
  const el = document.createElement('button');
  el.type = 'button'; el.className = `toast ${tone}`;
  el.innerHTML = `${face ? `<img class="tface" src="${face}" alt="">` : icon ? `<img class="ticon" src="${icon}" alt="">` : '<i aria-hidden="true"></i>'}<span>${text}</span>`;
  if (face || icon) el.classList.add('withface');
  el.addEventListener('click', () => el.remove());
  box.prepend(el);
  while (box.children.length > 2) box.lastElementChild.remove();
  setTimeout(() => el.remove(), ms);
}

    L.push('30 LET CASH = 400');
    L.push('40 LET DALE = 1100');
    L.push('50 LET ZEN = ZEN - 1');
  }
  L.push('60 IF ZEN <= 0 THEN PRINT "YOU STARTED A PODCAST": END');
  L.push('70 PRINT "BE THE PLUG"');
  L.push('80 GOTO 50');
  const body = dosSnap
    ? `${L.join('\n')}\n\nRUN\n<span class="err">?ZEN UNDERFLOW ERROR IN 50</span>\nOk`
    : `${L.join('\n')}\n\nOk`;
  const d = $('#dos');
  d.innerHTML = `<div class="mb">File  Edit  View  Search  Run  Debug  Options    Help</div>
    <fieldset><legend>UNPLUGGD.BAS</legend><pre>${body}</pre></fieldset>
    <div class="sl"><span>&lt;Tap anywhere to ${dosSnap ? 'accept your podcast' : 'return to mindfulness'}&gt;</span><span>00050:001</span></div>`;
  d.hidden = false;
  d.focus({ preventScroll: true });
  if (dosSnap) chime([[330, 0], [262, .2], [196, .4]], .8, .05);
}
function hideDos() {
  const d = $('#dos'); d.hidden = true;
  if (dosSnap) { dosSnap = false; endGame('zen'); }
  else runQueue();
}
let eggTaps = [];
function egg() {
  const now = Date.now();
  eggTaps = eggTaps.filter(t => now - t < 700); eggTaps.push(now);
  if (eggTaps.length >= 3) { eggTaps = []; showDos(false); }
}

/* ================= input ================= */
function act(a, el) {
  switch (a) {
    case 'begin': return modeSheet();
    case 'continue': return continueRun();
    case 'how': return howSheet();
    case 'report': cardWho = null; return reportSheet();
    case 'reroll': return reportSheet(true);
    case 'sharecard': return shareCard();
    case 'options': return optionsSheet();
    case 'soundopt': setSound(!soundOn); return optionsSheet();
    case 'handbook': return handbookSheet();
    case 'scores': return scoresSheet();
    case 'news': return newsSheet();
    case 'journal': return journalSheet();
    case 'menu': return menuSheet();
    case 'journey': return journeySheet();
    case 'rest': return restSheet();
    case 'restgo': return rest();
    case 'checkout': return checkoutSheet();
    case 'checkoutgo': return endGame('time');
    case 'van': daleCounting = false; return vanSheet();
    case 'vango': return vanGo();
    case 'trade': return doTrade();
    case 'offeryes': { const f = offerYes; offerYes = null; if (f) f(); return closeSheet(); }
    case 'encrun': return encRun();
    case 'encdecoy': return encDecoy();
    case 'encdonate': return encDonate();
    case 'encdone': { enc = null; themeStop(); musicDuck(false); musicResume(); closeSheet(); const h = heldToasts; heldToasts = []; h.forEach((t, i) => setTimeout(() => toast(...t), 250 + i * 150)); return; }
    case 'enchand': return encHand();
    case 'music': return musicSheet();
    case 'buycd': buyCD(); return sheetKind === 'van' ? vanSheet() : musicSheet();
    case 'mplay': return musicToggle();
    case 'mprev': return musicStep(-1);
    case 'mnext': return musicStep(1);
    case 'mvolup': return musicNudge(0.1);
    case 'mvoldn': return musicNudge(-0.1);
    case 'sign': return saveScore();
    case 'sound': setSound(!soundOn); return menuSheet();
    case 'welcome': closeSheet(true); queue = []; $('#toasts').innerHTML = ''; screen = 'welcome'; if (E.on) { eventStop(); musicResume(); } return render();
    case 'close': return closeSheet();
  }
}

document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('#dos')) return hideDos();
  if (t.id === 'scrim' && $('#sheet').dataset.dismiss) return closeSheet();
  const eg = t.closest('[data-egg]'); if (eg) return egg();
  const md = t.closest('[data-mode]'); if (md) { closeSheet(true); return startGame(MODES[+md.dataset.mode]); }
  const go = t.closest('[data-go]'); if (go && !go.disabled) return walk(+go.dataset.go);
  const row = t.closest('[data-item]'); if (row) return openTrade(row.dataset.item);
  const tr = t.closest('[data-track]'); if (tr) return musicPick(tr.dataset.track);
  const pg = t.closest('#lcdProg');
  const pa = E.on ? E.el : M.audio;
  if (pg && pa && isFinite(pa.duration)) { const r = pg.getBoundingClientRect(); pa.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * pa.duration; return; }
  const tm = t.closest('[data-tmode]');
  if (tm && !tm.disabled) { trade.mode = tm.dataset.tmode; trade.q = tradeMax(); SND.tap(); return tradeSheet(); }
  const ts = t.closest('[data-tset]');
  if (ts && !ts.disabled) { const m = tradeMax(); trade.q = ts.dataset.tset === 'max' ? m : ts.dataset.tset === 'half' ? Math.max(1, Math.floor(m / 2)) : 1; return updateTrade(); }
  const vm = t.closest('[data-vmode]'); if (vm && !vm.disabled) { vanMode = vm.dataset.vmode; return vanSheet(); }
  const vs = t.closest('[data-vset]');
  if (vs && !vs.disabled) { const m = vanMax(vanMode); vanAmt = vs.dataset.vset === 'max' ? m : vs.dataset.vset === 'half' ? Math.floor(m / 2) : Math.floor(m / 4); return updateVan(); }
  const a = t.closest('[data-act]'); if (a && !a.disabled) act(a.dataset.act, a);
});
document.addEventListener('input', e => {
  if (e.target.id === 'tslider') { trade.q = +e.target.value; updateTrade(); }
  if (e.target.id === 'vslider') { vanAmt = +e.target.value; updateVan(); }
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (!$('#dos').hidden) { e.preventDefault(); return hideDos(); }
  const open = !$('#scrim').hidden;
  if (open) {
    if (k === 'escape' && $('#sheet').dataset.dismiss) { e.preventDefault(); return closeSheet(); }
    if (k === 'tab') {
      const f = [...$('#sheet').querySelectorAll('button:not(:disabled), input:not(:disabled)')];
      if (f.length) {
        const i = f.indexOf(document.activeElement);
        const n = e.shiftKey ? (i <= 0 ? f.length - 1 : i - 1) : (i === f.length - 1 ? 0 : i + 1);
        e.preventDefault(); f[n].focus();
      }
      return;
    }
    if (sheetKind === 'journey' && /^[1-6]$/.test(k)) { const ix = +k - 1; if (canReach(ix)) { e.preventDefault(); walk(ix); } }
    if (sheetKind === 'mode' && /^[1-4]$/.test(k)) { e.preventDefault(); closeSheet(true); startGame(MODES[+k - 1]); }
    return;
  }
  if (e.target.tagName === 'INPUT') { if (k === 'enter' && e.target.id === 'signname') { e.preventDefault(); saveScore(); } return; }
  if (screen === 'game' && S && !S.over) {
    if (k === 'j' || k === 'w') { e.preventDefault(); journeySheet(); }
    else if (k === 'r' || k === 'z') { e.preventDefault(); restSheet(); }
    else if (k === 'v') { e.preventDefault(); vanSheet(); }
    else if (k === 'm') { e.preventDefault(); musicSheet(); }
  }
});

['logo', 'tagline', 'welcome', 'header'].forEach(k => document.documentElement.style.setProperty(`--img-${k}`, `url(${IMG[k]})`));
window.addEventListener('offline', () => toast("Signal lost. You're fully unplugged now. The game keeps working.", 'good', 5000));
render();
})();
</script>

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
